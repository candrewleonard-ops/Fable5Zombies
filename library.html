<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNDEAD BUNKER — Asset Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0c0d10; color: #e8dfcf; font-family: 'Barlow Condensed', sans-serif; }
    #gl { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    #page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 30px 20px 80px; }
    header { text-align: center; margin-bottom: 26px; }
    h1 { font-family: 'Pirata One', serif; font-weight: 400; font-size: 62px; color: #b81414; text-shadow: 0 0 30px rgba(184,20,20,0.45); }
    header .sub { font-size: 16px; letter-spacing: 5px; color: #9a917f; text-transform: uppercase; }
    header a { color: #86c8ff; font-size: 16px; text-decoration: none; display: inline-block; margin-top: 10px; }
    h2 { font-family: 'Pirata One', serif; font-weight: 400; font-size: 30px; color: #f7d774; margin: 34px 0 12px; border-bottom: 1px solid rgba(247,215,116,0.2); padding-bottom: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: rgba(20, 21, 25, 0.55); border: 1px solid #26272c; }
    .card .view { width: 100%; height: 210px; }
    .card .meta { padding: 10px 14px 14px; }
    .card .name { font-size: 19px; font-weight: 700; letter-spacing: 1px; color: #e8dfcf; }
    .card .desc { font-size: 14px; color: #8a8172; margin-top: 2px; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="page">
    <header>
      <h1>ASSET LIBRARY</h1>
      <div class="sub">Undead Bunker · every asset procedural</div>
      <a href="/index.html">← Back to the game</a>
    </header>
    <div id="sections"></div>
  </div>
  <script type="module" src="/src/library.js"></script>
</body>
</html>
